name: Server checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and loopback integration tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q tls20_server tests tools
      - name: Check local documentation links
        run: python tools/check_docs.py

  native-profiles:
    name: Native profiles / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Select tested Rust toolchain for the optional ITS helper
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup override set 1.98.0
      - name: Build pinned permissive providers and production PAKE helper
        run: python tools/build_native_dependencies.py --output build/providers --with-gost --with-its --jobs 2
      - name: Native profile, interoperability and independent vector tests
        run: python tools/test_native_dependencies.py --manifest build/providers/providers.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: native-profile-build-log-${{ matrix.os }}
          path: build/providers/build.log
          retention-days: 7

  package:
    name: Build and verify Python packages
    needs: [test, native-profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tool
        run: python -m pip install -r requirements-dev.txt
      - name: Build source archive and wheel
        run: python -m build
      - name: Verify isolated wheel installation
        run: python tools/check_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tls20-server-python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
