[package]
name = "tls20-its"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rasn = { version = "=0.28.14", default-features = false, features = ["std", "bytes"] }
rasn-its = { version = "=0.28.14", default-features = false }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
p384 = { version = "=0.13.1", features = ["ecdsa"] }
bp256 = { version = "=0.14.0", features = ["arithmetic", "ecdsa", "sha256"] }
bp384 = { version = "=0.14.0", features = ["arithmetic", "ecdsa", "sha384"] }
ecdsa17 = { package = "ecdsa", version = "=0.17.0", features = ["algorithm"] }
geographiclib-rs = { version = "=0.2.7", default-features = false }
sha2 = "=0.10.9"

[patch.crates-io]
rasn = { path = "vendor/rasn" }

[profile.release]
panic = "unwind"
overflow-checks = true
lto = "thin"
