[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tls20-server"
version = "0.1.0"
description = "Experimental HTTPPS server and offline-PKI test client for independent TLS 2.0 draft-01"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
tls20-server = "tls20_server.__main__:main"

[project.urls]
Repository = "https://github.com/PapauloGamerOfc/tls20-server"
Specification = "https://github.com/PapauloGamerOfc/tls20-spec"

[tool.setuptools.packages.find]
include = ["tls20_server*"]
