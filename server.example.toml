# Local-only by default. To expose the prototype deliberately, use 0.0.0.0:343
# and configure your firewall. This is an experimental port, not an assignment.
listen = "127.0.0.1:343"
upstream = "127.0.0.1:8080"
# The backend must actually speak this protocol. h2 means cleartext HTTP/2
# prior knowledge, not an HTTP/1.1 Upgrade request or a protocol translator.
upstream_protocol = "http/1.1"
# AES-128-GCM, AES-256-GCM/SHA-384, ChaCha20-Poly1305, AES-CCM, AES-CCM-8.
cipher_suites = [0x1301, 0x1302, 0x1303, 0x1304, 0x1305]
record_size_limit = 16385 # Includes inner content type and padding
certificate_compression = [1, 2, 3] # zlib, Brotli, Zstandard; [] disables
heartbeat_mode = 0 # 0 disabled, 1 allow peer probes, 2 deny peer probes
ticket_count_limit = 1 # Local per-handshake limit; requested counts are hints
server_name = "localhost"
certificate_chain = "lab/fullchain.pem"
private_key = "lab/server.key"

max_connections = 128
handshake_timeout_seconds = 10
# Optional reachability challenge: adds one RTT and disables 0-RTT acceptance
# for challenged handshakes. Uses ephemeral per-listener HMAC keys, no disk cache.
retry_cookie = false
retry_cookie_lifetime_seconds = 30 # 1..300
connect_timeout_seconds = 5
idle_timeout_seconds = 60
max_connection_seconds = 3600
max_bytes_per_direction = 16777216

# Resumption saves the certificate flight. Tickets/replay state stay in memory;
# restarting the listener forces a new full handshake.
session_tickets = true
ticket_lifetime_seconds = 86400
ticket_capacity = 4096

# 0-RTT is replayable. Enable only after configuring the backend to understand
# Early-Data: 1 / HTTP 425 and auditing these exact routes for replay safety.
# A GET method alone is NOT evidence that a route is safe to replay.
upstream_early_data_aware = false
early_data_paths = [] # Example, after auditing: ["/", "/static/index.html"]
max_early_data_bytes = 16384
